name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      release: true
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate-package
          path: dist
      - name: Publish the tested bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.checks.outputs.version }}
          PRERELEASE: ${{ needs.checks.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          test "$GITHUB_REF_NAME" = "v$VERSION"
          flags=(--latest)
          if [[ "$PRERELEASE" == true ]]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "dnsapi-$VERSION.tar.gz" SHA256SUMS metadata.json --repo "$GITHUB_REPOSITORY" --verify-tag --title "dnsapi $VERSION" --generate-notes "${flags[@]}"
