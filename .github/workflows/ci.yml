name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php-version }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl
          coverage: none

      - name: Reject tracked runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          for forbidden in config.json .env; do
            if git ls-files --error-unmatch "$forbidden" >/dev/null 2>&1; then
              echo "Runtime configuration must not be tracked: $forbidden" >&2
              exit 1
            fi
          done

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            php -l "$file"
          done < <(git ls-files '*.php')
