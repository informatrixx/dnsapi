name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php-version }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl
          coverage: none

      - name: Reject tracked runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          forbidden_files="$(git ls-files | grep -E '(^|/)(config\\.json|\\.env($|\\.)|.*\\.log$|\\.codex-sessions\\.tsv$)' || true)"
          if [ -n "$forbidden_files" ]; then
            echo 'Runtime configuration must not be tracked:' >&2
            printf '%s\n' "$forbidden_files" >&2
            exit 1
          fi

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            php -l "$file"
          done < <(git ls-files '*.php')
